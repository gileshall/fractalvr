<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fractalvr</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    #hud {
      position: fixed; right: 12px; top: 190px; padding: 8px 12px; display: none;
      font: 12px/1.5 ui-monospace, monospace; color: #e8e8f0; white-space: pre;
      background: rgba(0,0,0,.5); border-radius: 6px; pointer-events: none;
    }
    #help {
      position: fixed; right: 12px; top: 12px; padding: 10px 14px;
      font: 13px/1.6 ui-monospace, monospace; color: #c4c8d8; white-space: pre;
      background: rgba(0,0,0,.55); border-radius: 6px; pointer-events: none;
      transition: opacity 1.5s;
    }
    #help.gone { opacity: 0; }
    #help b { color: #fff; font-weight: normal; }
    #help a { color: #8fa8ff; pointer-events: auto; }
  </style>
</head>
<body>
  <div id="help"><b>Tab</b>    menu: more fractals, colors, settings
<b>N / P</b>  next / previous fractal
<b>click</b>  look around (Esc lets go)
<b>WASD</b>   fly, scroll to zoom

Open source: <a href="https://github.com/gileshall/fractalvr" target="_blank" rel="noopener">github.com/gileshall/fractalvr</a></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
